# Moments for the Origins page.
#
# The meetup spine comes from content/events/ automatically. This file holds
# the personal history before and outside the group, and the records of which
# event each person first turned up to.
#
# A moment carries either `date` + `title`, or `event` (which resolves both
# from the event page). Never both.
#
# A record anchored to a meetup with `event` may also carry `there` and
# `away`, lists of people's slugs. Several records may anchor to one meetup.
# `there` puts a bead on that person's thread inside the meetup's oval: the
# record says they were there. `away` takes their thread around the oval
# instead of through it: the record says they were not. With neither, a
# member's thread runs through the oval with no bead, which says only that
# they were in the group then, except at the meetup they joined at, where
# they always have the ringed bead. Nobody can be recorded at a meetup before
# the one they joined at, or away from the one they joined at.
#
# `date` accepts YYYY, YYYY-MM or YYYY-MM-DD. Write the precision you actually
# have; it is never padded, and the page displays what is written here.
#
# Lines marked CONFIRM are best guesses awaiting a better source. Grep for
# them when backfilling.

