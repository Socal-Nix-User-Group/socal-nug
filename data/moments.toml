# Moments for the Origins page.
#
# The meetup spine comes from content/events/ automatically. This file holds
# the personal history before and outside the group, and the records of which
# event each person first turned up to.
#
# A moment carries either `date` + `title`, or `event` (which resolves both
# from the event page). Never both.
#
# A record anchored to a meetup with `event` may also carry `there` and
# `away`, lists of people's slugs. Several records may anchor to one meetup.
# `there` puts a bead on that person's thread inside the meetup's oval: the
# record says they were there. `away` breaks their thread either side of
# the oval and puts a hollow bead in their place inside it: the record says
# they were not. With neither, a member's thread runs through the oval with
# no bead, which says only that they were in the group then, except at the
# meetup they joined at, where they always have the ringed bead. Nobody can
# be recorded at a meetup before the one they joined at, or away from the
# one they joined at. A dated moment that is not a meetup may carry `away`
# and never `there`: its `people` already say who was there. `away` draws the
# same at it as at a meetup: the thread breaks either side of the oval with a
# hollow bead in their place inside it. Nobody can be both in `people` and in
# `away` on one moment, or away from a moment that comes before any moment
# they are at. Moments come in the order the page draws them: by date, a
# month or a year counting from its first day, then by id, a record anchored
# to an event going by the event's slug.
#
# `date` accepts YYYY, YYYY-MM or YYYY-MM-DD. Write the precision you actually
# have; it is never padded, and the page displays what is written here.
#
# A dated moment may carry `avatar`, the event's own mark: a site path to a
# square image under static/images/moments/ made to sit in a circle. An event
# that changes its mark each year has a file for each.
#
# Lines marked CONFIRM are best guesses awaiting a better source. Grep for
# them when backfilling.

