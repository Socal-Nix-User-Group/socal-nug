name: Verify site

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ${{ fromJSON('["ubuntu-latest", "self-hosted"]')[github.repository == 'github/docs-internal'] }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema
          pip install click
      - name: Verify Event Post Schema
        run: python ./scripts/verify_post.py --schema ./scripts/schemas/event.json content/events/20*.md
      - name: Verify Profile Post Schema
        run: python ./scripts/verify_post.py --schema ./scripts/schemas/profiles.json content/about/*.md

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zola (same version Netlify builds with)
        run: |
          version=$(sed -n 's/^ZOLA_VERSION = "\(.*\)"$/\1/p' netlify.toml)
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/getzola/zola/releases/download/v${version}/zola-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" zola
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zola" --version
      - name: Build the site and check the output
        run: python3 scripts/test_site.py
