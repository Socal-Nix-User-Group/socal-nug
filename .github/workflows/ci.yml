name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # One run per pull request, or per ref for pushes; a newer run cancels the superseded one.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix-checks:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - run: nix flake check -L

  workflow-security:
    name: workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#zizmor -- .github/
      - name: Verify action pins and version comments with pinact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#pinact -- run --check
