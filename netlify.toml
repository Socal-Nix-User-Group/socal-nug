# Netlify builds and deploys the site from this file: production from main, and a deploy
# preview per pull request. The GitHub Actions workflow only runs the checks.
[build]
publish = "public"
command = "zola build && python3 overlays/topLevel/socal-nug-make-event-ical/make_event_ical.py --output public/events/ content/events/20*.md"

[build.environment]
# Keep ZOLA_VERSION equal to the flake's zola: `nix flake check` fails when they differ.
ZOLA_VERSION = "0.23.6"
# The calendar script uses tomllib, so Python 3.11 or newer. Netlify installs
# requirements.txt before running the build command.
PYTHON_VERSION = "3.13"

# Zola bakes base_url into links, so previews are built for the URL Netlify assigns them.
[context.deploy-preview]
command = "zola build --base-url $DEPLOY_PRIME_URL && python3 overlays/topLevel/socal-nug-make-event-ical/make_event_ical.py --output public/events/ content/events/20*.md"
