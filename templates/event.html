{% extends "child.html" %}

{% block content %}
<h1 class="title is-1 my-4">
  {{ page.title }}
</h1>
<div class="columns event-details">
  <div class="column">
    <div class="content">
      <a href="event.ics" class="button">
        📅 Add to Calendar
      </a>
      <h3 class="title is-4 mt-3">Description</h3>
      {{ page.content | safe }}
    </div>
  </div>
  <div class="column is-one-third">
    {% include "partials/events.rsvp-card.html" %}
  </div>
</div>

{% if page.extra.gallery %}
{{ <gallery /> }}
{% endif %}

{% endblock content %}
